<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <!-- Light-gray left panel gradient (portfolio signature) -->
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>

    <!-- Orange accent gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D12"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <!-- Soft glow filter (no feComposite operator="over") -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Very subtle glow for dot -->
    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="960" height="220" fill="url(#bgGrad)"/>

  <!-- Subtle dark grid lines (desktop atmosphere) -->
  <g stroke="#1A1A1A" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="55" x2="960" y2="55"/>
    <line x1="0" y1="110" x2="960" y2="110"/>
    <line x1="0" y1="165" x2="960" y2="165"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
  </g>

  <!-- === PORTFOLIO SIGNATURE: DIAGONAL SPLIT (Light gray left zone) === -->
  <!-- Exactly mirrors portfolio hero's polygon clip: 54% width, angled right edge -->
  <polygon points="0,0 370,0 280,220 0,220" fill="url(#lightGrad)"/>

  <!-- === DIAGONAL SEAM: Neon orange laser line === -->
  <line x1="370" y1="0" x2="280" y2="220" stroke="#FF4D12" stroke-width="2.5" filter="url(#glow)" opacity="0.95"/>

  <!-- Animated traveling highlight on the seam (SMIL — GitHub-safe) -->
  <line x1="370" y1="0" x2="280" y2="220" stroke="#FFA07A" stroke-width="1.5" stroke-dasharray="80,140">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- === LEFT ZONE TEXT (Black on Light Gray) === -->

  <!-- "HI, I AM" label with pulsing orange dot -->
  <circle cx="42" cy="38" r="4" fill="#FF4D12" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="55" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="13" font-weight="800" fill="#000000" letter-spacing="1">HI, I AM</text>

  <!-- NAUMAN NASEER — Bold hero name -->
  <text x="38" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#000000" letter-spacing="1.5">NAUMAN</text>
  <text x="38" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="42" font-weight="900" fill="#000000" letter-spacing="1.5">NASEER</text>

  <!-- Role badge (black pill on light zone) -->
  <rect x="38" y="162" width="210" height="26" rx="6" fill="#111111"/>
  <text x="48" y="179" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">CS UNDERGRADUATE • BSCS</text>

  <!-- === RIGHT ZONE (Deep Dark) === -->

  <!-- Status pill (top-right, animated float via SMIL) -->
  <g>
    <rect x="385" y="22" width="265" height="26" rx="13" fill="#141414" stroke="#303030" stroke-width="1"/>
    <circle cx="400" cy="35" r="4" fill="#FF4D12">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="35" r="2.5" fill="#FFA07A"/>
    <text x="412" y="39" font-family="'Courier New',Courier,monospace" font-size="10" font-weight="600" fill="#E0E0E0" letter-spacing="0.4">OPEN TO INTERNSHIPS &amp; PROJECTS</text>
  </g>

  <!-- Big title: SOFTWARE CRAFTSMAN -->
  <text x="385" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" letter-spacing="1">SOFTWARE CRAFTSMAN</text>
  <text x="560" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif" font-size="20" font-weight="900" fill="#FF4D12" letter-spacing="1"> &amp; BUILDER</text>

  <!-- Subtitle tagline -->
  <text x="385" y="115" font-family="'Courier New',Courier,monospace" font-size="12" font-weight="500" fill="#B8B8B8" letter-spacing="0.3">Python &amp; C++ · DSA · OOP · React &amp; Web</text>

  <!-- Mindset quote -->
  <text x="385" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11" font-style="italic" fill="#737373">"Learn deeply, code with intent, build to last."</text>

  <!-- Tech pills row (right dark zone) -->
  <!-- Pill: C++ -->
  <rect x="385" y="160" width="50" height="24" rx="5" fill="#161616" stroke="#2A2A2A" stroke-width="1"/>
  <text x="410" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">C++</text>

  <!-- Pill: Python -->
  <rect x="443" y="160" width="62" height="24" rx="5" fill="#161616" stroke="#2A2A2A" stroke-width="1"/>
  <text x="474" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Python</text>

  <!-- Pill: DSA -->
  <rect x="513" y="160" width="52" height="24" rx="5" fill="#161616" stroke="#2A2A2A" stroke-width="1"/>
  <text x="539" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">DSA</text>

  <!-- Pill: OOP -->
  <rect x="573" y="160" width="52" height="24" rx="5" fill="#161616" stroke="#2A2A2A" stroke-width="1"/>
  <text x="599" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">OOP</text>

  <!-- Pill: React (orange accent) -->
  <rect x="633" y="160" width="62" height="24" rx="5" fill="#1A0A05" stroke="#FF4D12" stroke-width="1"/>
  <text x="664" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FF4D12" text-anchor="middle">React</text>

  <!-- Pill: Git -->
  <rect x="703" y="160" width="46" height="24" rx="5" fill="#161616" stroke="#2A2A2A" stroke-width="1"/>
  <text x="726" y="176" font-family="'Courier New',Courier,monospace" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Git</text>

  <!-- Atmospheric glow orb (top-right corner, subtle) -->
  <circle cx="920" cy="30" r="90" fill="#FF4D12" opacity="0.03"/>
</svg>
