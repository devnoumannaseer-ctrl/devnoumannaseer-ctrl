<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian to Dark Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#07090E"/>
    </linearGradient>

    <!-- Left accent zone gradient: Sleek dark navy card surface -->
    <linearGradient id="leftPanelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322"/>
      <stop offset="100%" stop-color="#090C16"/>
    </linearGradient>

    <!-- Neon Synthwave Accent: Electric Pink to Violet -->
    <linearGradient id="neonPinkViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Sunset Horizon Glow Gradient -->
    <radialGradient id="sunsetGlow" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#07090E" stop-opacity="0"/>
    </radialGradient>

    <!-- High-intensity neon glow filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1"/>
      <feGaussianBlur stdDeviation="10" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle dot glow -->
    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="960" height="220" fill="url(#bgGrad)" rx="10"/>

  <!-- Ambient Sunset Horizon Glow -->
  <rect width="960" height="220" fill="url(#sunsetGlow)" rx="10"/>

  <!-- === SYNTHWAVE PERSPECTIVE / CYBER GRID LINES === -->
  <g stroke="#8B5CF6" stroke-width="0.75" opacity="0.18">
    <!-- Horizontal lines with progressive density -->
    <line x1="0" y1="40" x2="960" y2="40"/>
    <line x1="0" y1="85" x2="960" y2="85"/>
    <line x1="0" y1="130" x2="960" y2="130"/>
    <line x1="0" y1="165" x2="960" y2="165"/>
    <line x1="0" y1="190" x2="960" y2="190"/>
    <line x1="0" y1="205" x2="960" y2="205"/>
    <line x1="0" y1="215" x2="960" y2="215"/>

    <!-- Vertical grid lines -->
    <line x1="120" y1="0" x2="120" y2="220"/>
    <line x1="240" y1="0" x2="240" y2="220"/>
    <line x1="360" y1="0" x2="360" y2="220"/>
    <line x1="480" y1="0" x2="480" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="720" y1="0" x2="720" y2="220"/>
    <line x1="840" y1="0" x2="840" y2="220"/>
  </g>

  <!-- Outer Border with Neon Accent -->
  <rect x="1" y="1" width="958" height="218" rx="9" fill="none" stroke="#252D42" stroke-width="1.5"/>

  <!-- === LEFT GEOMETRIC ZONE (Angled signature panel) === -->
  <polygon points="0,0 350,0 270,220 0,220" fill="url(#leftPanelGrad)" opacity="0.95"/>

  <!-- Neon Glowing Diagonal Seam -->
  <line x1="350" y1="0" x2="270" y2="220" stroke="url(#neonPinkViolet)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Traveling Highlight Pulse on Diagonal Seam -->
  <line x1="350" y1="0" x2="270" y2="220" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="60,160">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- === LEFT ZONE CONTENT === -->
  <!-- "HI, I AM" with Pulsing Neon Dot -->
  <circle cx="42" cy="38" r="4.5" fill="#EC4899" filter="url(#dotGlow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="56" y="43" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="13" font-weight="800" fill="#F472B6" letter-spacing="1.5">HI, I AM</text>

  <!-- Name Hero: NAUMAN NASEER -->
  <text x="38" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">NAUMAN</text>
  <text x="38" y="145" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="44" font-weight="900" fill="url(#neonPinkViolet)" letter-spacing="1.5">NASEER</text>

  <!-- Academic Badge Pill -->
  <rect x="38" y="163" width="205" height="28" rx="6" fill="#141A2D" stroke="#374151" stroke-width="1"/>
  <text x="48" y="181" font-family="'JetBrains Mono','Courier New',monospace" font-size="10.5" font-weight="700" fill="#E2E8F0" letter-spacing="0.5">CS UNDERGRADUATE • BSCS</text>

  <!-- === RIGHT ZONE CONTENT === -->
  <!-- Status Pill (Top-Right) -->
  <g>
    <rect x="365" y="24" width="270" height="26" rx="13" fill="#111827" stroke="#374151" stroke-width="1"/>
    <circle cx="380" cy="37" r="4" fill="#10B981">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="37" r="2" fill="#6EE7B7"/>
    <text x="393" y="41" font-family="'JetBrains Mono',monospace" font-size="9.5" font-weight="700" fill="#D1D5DB" letter-spacing="0.4">OPEN TO INTERNSHIPS &amp; PROJECTS</text>
  </g>

  <!-- Headline: SOFTWARE CRAFTSMAN & BUILDER -->
  <text x="365" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="900" fill="#F8FAFC" letter-spacing="1">SOFTWARE CRAFTSMAN</text>
  <text x="635" y="92" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="900" fill="#EC4899" letter-spacing="1"> &amp; BUILDER</text>

  <!-- Subtitle Tagline -->
  <text x="365" y="120" font-family="'JetBrains Mono',monospace" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="0.3">Python &amp; C++ · Data Structures &amp; OOP · Modern Web Apps</text>

  <!-- Quote Box with Neon Violet Edge -->
  <rect x="365" y="146" width="555" height="45" rx="6" fill="#0C101C" stroke="#232B42" stroke-width="1"/>
  <rect x="365" y="146" width="3" height="45" rx="1.5" fill="url(#neonPinkViolet)"/>
  <text x="382" y="166" font-family="'JetBrains Mono',monospace" font-size="11" font-style="italic" fill="#E2E8F0">"Learn deeply, code with intent, build to last."</text>
  <text x="382" y="181" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9.5" font-weight="600" fill="#64748B">— Algorithmic Optimization · Clean Architecture · Scalable Systems</text>
</svg>
