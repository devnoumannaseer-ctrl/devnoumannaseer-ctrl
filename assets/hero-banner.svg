<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="100%" height="240">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080808" />
      <stop offset="50%" stop-color="#0e0e0e" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="splitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAEAEA" />
      <stop offset="100%" stop-color="#D0D0D0" />
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D12" />
      <stop offset="50%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>

    <linearGradient id="laserGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D12" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF6B35" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF4D12" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(1.35); }
    }
    @keyframes sweepLaser {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes floatTag {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes shimmerText {
      0%, 100% { opacity: 0.95; }
      50% { opacity: 0.75; }
    }

    .pulse-dot {
      transform-origin: 48px 42px;
      animation: pulseDot 2.2s ease-in-out infinite;
    }
    .laser-line {
      stroke-dasharray: 120 280;
      animation: sweepLaser 4.5s linear infinite;
    }
    .badge-float {
      animation: floatTag 4s ease-in-out infinite;
    }
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Montserrat', 'Helvetica Neue', sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    }
    .sans-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
  </style>

  <!-- Dark Background Canvas with Rounded Border -->
  <rect x="1" y="1" width="958" height="238" rx="16" fill="url(#bgGrad)" stroke="#262626" stroke-width="1.5" />

  <!-- Subtle Background Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="40" x2="960" y2="40" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="120" x2="960" y2="120" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="200" x2="960" y2="200" />
    <line x1="160" y1="0" x2="160" y2="240" />
    <line x1="320" y1="0" x2="320" y2="240" />
    <line x1="480" y1="0" x2="480" y2="240" />
    <line x1="640" y1="0" x2="640" y2="240" />
    <line x1="800" y1="0" x2="800" y2="240" />
  </g>

  <!-- DIAGONAL SPLIT ACCENT (Portfolio Signature: Light Gray on Left) -->
  <path d="M 0 0 L 390 0 L 300 240 L 0 240 Z" fill="url(#splitGrad)" />

  <!-- Animated Neon Laser on the diagonal seam -->
  <line x1="390" y1="0" x2="300" y2="240" stroke="#FF4D12" stroke-width="3" filter="url(#glow)" opacity="0.9" />
  <line x1="390" y1="0" x2="300" y2="240" stroke="#FFA07A" stroke-width="2" class="laser-line" />

  <!-- LEFT ZONE (Light Gray Background with Black Typography) -->
  <!-- "Hi, I am" with pulsing orange dot -->
  <g transform="translate(42, 42)">
    <circle cx="0" cy="0" r="4.5" fill="#FF4D12" class="pulse-dot" />
    <text x="14" y="4" class="sans-text" font-size="14" font-weight="800" fill="#000000" letter-spacing="0.5">HI, I AM</text>
  </g>

  <!-- "NAUMAN" -->
  <text x="42" y="104" class="title-main" font-size="46" fill="#000000">NAUMAN</text>
  <!-- "NASEER" -->
  <text x="42" y="152" class="title-main" font-size="46" fill="#000000">NASEER</text>

  <!-- Left Subtitle Badge in Light Zone -->
  <rect x="42" y="174" width="215" height="28" rx="6" fill="#000000" />
  <text x="52" y="193" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.8">CS UNDERGRADUATE</text>
  <circle cx="236" cy="188" r="3.5" fill="#FF4D12" />

  <!-- RIGHT ZONE (Deep Dark Obsidian Background) -->
  <!-- Top Status Pill: Available for Internships -->
  <g transform="translate(390, 36)" class="badge-float">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#141414" stroke="#292929" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#FF4D12" filter="url(#softGlow)" />
    <circle cx="16" cy="14" r="2.5" fill="#FFA07A" />
    <text x="30" y="18" class="mono-text" font-size="10.5" font-weight="600" fill="#E5E5E5" letter-spacing="0.6">OPEN TO INTERNSHIPS &amp; PROJECTS</text>
  </g>

  <!-- Right Big Role Title -->
  <text x="390" y="104" class="title-main" font-size="25" fill="#FFFFFF" letter-spacing="1.5">
    SOFTWARE CRAFTSMAN <tspan fill="#FF4D12">&amp;</tspan> BUILDER
  </text>

  <!-- Secondary Role / Tagline -->
  <text x="390" y="132" class="mono-text" font-size="13" font-weight="500" fill="#B8B8B8" letter-spacing="0.5">
    Python &amp; C++ Programmer | Core CS Foundations | Modern Web
  </text>

  <!-- Portfolio Mindset Quote -->
  <text x="390" y="158" class="sans-text" font-size="12" font-style="italic" fill="#8C8C8C">
    "Learn deeply, code with intent, build resilient software to last."
  </text>

  <!-- Technology Pills in Dark Zone -->
  <g transform="translate(390, 180)">
    <!-- Pill 1: C++ -->
    <rect x="0" y="0" width="62" height="26" rx="6" fill="#161616" stroke="#333333" stroke-width="1" />
    <text x="14" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF">C++</text>

    <!-- Pill 2: Python -->
    <rect x="70" y="0" width="76" height="26" rx="6" fill="#161616" stroke="#333333" stroke-width="1" />
    <text x="82" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF">Python</text>

    <!-- Pill 3: DSA -->
    <rect x="154" y="0" width="66" height="26" rx="6" fill="#161616" stroke="#333333" stroke-width="1" />
    <text x="168" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF">DSA</text>

    <!-- Pill 4: OOP -->
    <rect x="228" y="0" width="66" height="26" rx="6" fill="#161616" stroke="#333333" stroke-width="1" />
    <text x="242" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF">OOP</text>

    <!-- Pill 5: React & Web -->
    <rect x="302" y="0" width="102" height="26" rx="6" fill="#161616" stroke="#333333" stroke-width="1" />
    <text x="313" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FFFFFF">React &amp; Web</text>

    <!-- Pill 6: Algorithms -->
    <rect x="412" y="0" width="112" height="26" rx="6" fill="#161616" stroke="#FF4D12" stroke-width="1" />
    <text x="422" y="17" class="mono-text" font-size="11" font-weight="700" fill="#FF4D12">Algorithms</text>
  </g>

  <!-- Right Decorative Glowing Orb -->
  <circle cx="910" cy="50" r="120" fill="#FF4D12" opacity="0.05" filter="url(#glow)" pointer-events="none" />
</svg>
