<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 24" width="100%" height="24">
  <defs>
    <linearGradient id="divBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0" />
      <stop offset="15%" stop-color="#262626" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3A3A3A" stop-opacity="1" />
      <stop offset="85%" stop-color="#262626" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#262626" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="sweepLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D12" stop-opacity="0" />
      <stop offset="45%" stop-color="#FF4D12" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFA07A" stop-opacity="1" />
      <stop offset="55%" stop-color="#FF4D12" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF4D12" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseRay {
      0% { transform: translateX(-400px); }
      100% { transform: translateX(960px); }
    }
    .laser-ray {
      animation: pulseRay 4s ease-in-out infinite;
    }
  </style>

  <!-- Static Track Line -->
  <line x1="60" y1="12" x2="900" y2="12" stroke="url(#divBg)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Center Diamond Accent -->
  <rect x="475" y="7" width="10" height="10" rx="2" transform="rotate(45 480 12)" fill="#141414" stroke="#FF4D12" stroke-width="1.5" />

  <!-- Animated Traveling Light Ray -->
  <g class="laser-ray" filter="url(#divGlow)">
    <line x1="0" y1="12" x2="250" y2="12" stroke="url(#sweepLaser)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
