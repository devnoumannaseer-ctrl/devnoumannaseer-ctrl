<svg width="1600" height="420" viewBox="0 0 1600 420" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Deep dark overlay gradient -->
    <linearGradient id="darkOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:0.97"/>
      <stop offset="30%" style="stop-color:#08090f;stop-opacity:0.85"/>
      <stop offset="50%" style="stop-color:#0a0b14;stop-opacity:0.70"/>
      <stop offset="70%" style="stop-color:#08090f;stop-opacity:0.85"/>
      <stop offset="100%" style="stop-color:#050508;stop-opacity:0.97"/>
    </linearGradient>
    <!-- Top/Bottom fade gradient -->
    <linearGradient id="topFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#050508;stop-opacity:0"/>
      <stop offset="80%" style="stop-color:#050508;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#050508;stop-opacity:1"/>
    </linearGradient>
    <!-- Blue accent glow -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#53D0FF;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#53D0FF;stop-opacity:0"/>
    </radialGradient>
    <!-- Text glow filter -->
    <filter id="nameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Clip path for rounded corners -->
    <clipPath id="roundedCard">
      <rect width="1600" height="420" rx="0" ry="0"/>
    </clipPath>
  </defs>

  <!-- Background base -->
  <rect width="1600" height="420" fill="#050508"/>

  <!-- Hands background image (centered, full-width, scaled to fill) -->
  <image
    href="https://raw.githubusercontent.com/devnoumannaseer-ctrl/devnoumannaseer-ctrl/main/assets/hands-bg.png"
    x="0" y="40"
    width="1600" height="340"
    preserveAspectRatio="xMidYMid slice"
    opacity="0.75"
    clip-path="url(#roundedCard)"
  />

  <!-- Dark overlay to ensure text readability -->
  <rect width="1600" height="420" fill="url(#darkOverlay)"/>

  <!-- Top and bottom fade -->
  <rect width="1600" height="420" fill="url(#topFade)"/>

  <!-- Subtle blue center glow behind text -->
  <ellipse cx="800" cy="210" rx="420" ry="140" fill="url(#blueGlow)" opacity="0.6"/>

  <!-- Thin top accent line -->
  <rect x="0" y="0" width="1600" height="1.5" fill="#53D0FF" opacity="0.3"/>

  <!-- NAUMAN NASEER — main heading -->
  <!-- Glow layer -->
  <text x="800" y="178" text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
    font-weight="900" font-size="80" letter-spacing="14"
    fill="#53D0FF" opacity="0.18" filter="url(#nameGlow)">NAUMAN NASEER</text>
  <!-- Main white text -->
  <text x="800" y="178" text-anchor="middle"
    font-family="'Segoe UI', 'Inter', 'Arial Black', sans-serif"
    font-weight="900" font-size="80" letter-spacing="14"
    fill="#FFFFFF">NAUMAN NASEER</text>

  <!-- Thin accent line under name -->
  <line x1="560" y1="196" x2="1040" y2="196" stroke="#53D0FF" stroke-width="1.5" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="800" y="232" text-anchor="middle"
    font-family="'Segoe UI', 'Courier New', monospace"
    font-weight="400" font-size="20" letter-spacing="5"
    fill="#94a3b8" opacity="0.9">CS UNDERGRADUATE  ·  PYTHON &amp; C++ PROGRAMMER</text>

  <!-- Tags row -->
  <!-- Tag 1: C++ & Python -->
  <rect x="510" y="262" width="160" height="30" rx="15" fill="#53D0FF" opacity="0.08" stroke="#53D0FF" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="590" y="282" text-anchor="middle"
    font-family="'Segoe UI', monospace" font-size="12" letter-spacing="2"
    fill="#53D0FF" opacity="0.85">C++ &amp; PYTHON</text>

  <!-- Tag 2: Algorithms & DSA -->
  <rect x="688" y="262" width="186" height="30" rx="15" fill="#FF7A1A" opacity="0.08" stroke="#FF7A1A" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="781" y="282" text-anchor="middle"
    font-family="'Segoe UI', monospace" font-size="12" letter-spacing="2"
    fill="#FF7A1A" opacity="0.85">ALGORITHMS &amp; DSA</text>

  <!-- Tag 3: Full-Stack Web -->
  <rect x="892" y="262" width="162" height="30" rx="15" fill="#D946EF" opacity="0.08" stroke="#D946EF" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="973" y="282" text-anchor="middle"
    font-family="'Segoe UI', monospace" font-size="12" letter-spacing="2"
    fill="#D946EF" opacity="0.85">FULL-STACK WEB</text>

  <!-- Bottom thin accent line -->
  <rect x="0" y="418" width="1600" height="2" fill="#53D0FF" opacity="0.3"/>
</svg>
